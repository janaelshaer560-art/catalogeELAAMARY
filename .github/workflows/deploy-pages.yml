name: Deploy catalog to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_DRIVE_API_KEY" ]; then
            echo "::error::Add GOOGLE_DRIVE_API_KEY as a repository Actions secret."
            exit 1
          fi

          mkdir -p dist
          cp index.html scripts.js styles.css dist/
          cp -R elaamaryph dist/
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            apiKey: process.env.GOOGLE_DRIVE_API_KEY,
            rootFolderId: '1NEJtg_yYAgdpQGcBr6Ql0YlRo3VyOK66'
          };
          fs.writeFileSync(
            'dist/drive-config.js',
            `window.CATALOG_DRIVE_CONFIG = ${JSON.stringify(config, null, 2)};\n`
          );
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
