<!DOCTYPE html>
<html class="dark" dir="rtl" lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark">
  <title>العمارى للأثاث | Elammary Furniture</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Arabic:wght@400;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    window.tailwind = window.tailwind || {};
    window.tailwind.config = { darkMode: "class", theme: { extend: {} } };
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="styles.css?v=4">
  <style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}</style>
</head>
<body class="bg-background text-on-surface font-body-md selection:bg-primary/30">
  <nav class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl border-b border-outline-variant/40 shadow-[0_10px_40px_rgba(252,207,62,0.08)] h-20 transition-all duration-500">
    <div class="max-w-container-max mx-auto px-8 md:px-16 flex items-center justify-between h-full">
      <div class="hidden md:flex items-center gap-10 font-body-lg text-body-lg tracking-wide">
        <a class="text-primary border-b-2 border-primary pb-1 font-bold" href="#">الرئيسية</a>
        <a class="text-on-surface-variant hover:text-primary" href="#catalog">الأقسام</a>
      </div>
      <a class="flex-shrink-100" href="#" aria-label="العودة للرئيسية">
        <img alt="شعار العمارى للأثاث" class="h-16 w-auto object-contain drop-shadow-gold" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0PUbs-TQBCkF6vD4Beei3vdf_wfUa2KfKCgzVbFbMGT3X48qam0thPWAOfyUkv1_PrOP9po-HxGVTRtqX8BtZrJJ0KTGLbVoHTgmWSTrCZKqQp9iSPDrbX9hCwhm5lTZSqSuqX61bbq6aL49ATtGY_CAmktILSzCDNjEHzmg0_JEoH7Fg_dpfMheFG0Ane0dPqTxtTMvg57LQg3of39mf8_ajK9AiSBE3EN8dbKALQ0mXQK81s8Upj32BSL2umKYZYnA"/>
      </a>
      <a class="md:hidden text-primary" href="#catalog" aria-label="تصفح الأقسام">
        <span class="material-symbols-outlined text-4xl" aria-hidden="true">grid_view</span>
      </a>
    </div>
  </nav>

  <header class="relative min-h-screen w-full overflow-hidden flex items-center pt-20">
    <div class="absolute inset-0 z-0">
      <div class="absolute inset-0 hero-overlay z-10"></div>
      <div class="w-full h-full bg-cover bg-center animate-subtle-zoom" style="background-image:url('elaamaryph/backgr.jpg')"></div>
    </div>
    <div class="relative z-20 max-w-container-max mx-auto px-gutter w-full text-right">
      <div class="max-w-3xl flex flex-col items-start md:items-end">
        <h1 class="font-display-lg text-display-lg md:text-[76px] md:leading-[1.1] text-on-surface mb-6">
          مرحباً بكم في <span class="text-gradient-gold block md:inline">العمارى للأثاث</span>
        </h1>
        <p class="font-body-lg text-body-lg md:text-[24px] text-on-surface-variant max-w-xl leading-relaxed mb-10 border-r-4 border-primary pr-8">
          لأن الجودة تُصنع… والثقة تُكتسب
        </p>
        <a class="group btn-primary-gold px-12 py-5 rounded-lg flex items-center gap-3 text-black font-bold text-body-lg gold-glow" href="#catalog">
          تصفح الكتالوج
          <span class="material-symbols-outlined transition-transform group-hover:translate-x-[-10px]" aria-hidden="true">west</span>
        </a>
      </div>
    </div>
  </header>

  <main id="catalog" class="catalog-main px-gutter max-w-container-max mx-auto" tabindex="-1">
    <div id="catalogPage" class="catalog-page">
      <div class="catalog-page__top">
        <button id="catalogBack" class="catalog-back" type="button" hidden>
          <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
          رجوع
        </button>
        <nav id="catalogBreadcrumbs" class="catalog-breadcrumbs" aria-label="مسار الكتالوج"></nav>
        <button id="catalogRefresh" class="catalog-refresh" type="button">
          <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
          تحديث الصور
        </button>
      </div>
      <header class="catalog-page__header">
        <p class="catalog-eyebrow">كتالوج العمارى</p>
        <h2 id="catalogTitle">أقسام الأثاث</h2>
        <p id="catalogDescription" class="text-on-surface-variant">اختاري قسمًا لاستعراض التصميمات المتاحة.</p>
      </header>
      <p id="driveStatus" class="catalog-status text-on-surface-variant" role="status" aria-live="polite"></p>
      <section id="catalogGrid" class="catalog-grid" aria-label="أقسام الأثاث"></section>
      <section id="galleryGrid" class="gallery-grid" aria-label="تصميمات القسم" hidden></section>
    </div>
  </main>

  <div id="imageViewer" class="image-viewer" hidden aria-hidden="true">
    <div class="image-viewer__backdrop" data-close-viewer></div>
    <div class="image-viewer__dialog" role="dialog" aria-modal="true" aria-labelledby="imageViewerTitle">
      <button type="button" class="image-viewer__close" data-close-viewer aria-label="إغلاق الصورة">
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
      </button>
      <div class="image-viewer__header">
        <h2 id="imageViewerTitle"></h2>
        <p id="imageViewerCounter"></p>
      </div>
      <div class="image-viewer__stage">
        <button type="button" class="image-viewer__nav" data-viewer-nav="previous" aria-label="الصورة السابقة">
          <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
        </button>
        <div class="image-viewer__frame">
          <img id="imageViewerImage" src="" alt="" />
          <p id="imageViewerError" hidden>تعذر تحميل الصورة. يمكنك الرجوع إلى المعرض والمحاولة مرة أخرى.</p>
        </div>
        <button type="button" class="image-viewer__nav" data-viewer-nav="next" aria-label="الصورة التالية">
          <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
        </button>
      </div>
    </div>
  </div>

  <footer class="w-full py-section-padding bg-surface-container-lowest border-t border-outline-variant/30">
    <div class="max-w-container-max mx-auto px-gutter flex justify-center items-center">
      <p class="text-on-surface-variant">© العمارى للأثاث</p>
    </div>
  </footer>

  <script src="drive-config.js?v=2"></script>
  <script src="scripts.js?v=5"></script>
</body>
</html>
