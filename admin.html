<!doctype html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة الكتالوج</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .admin-shell{min-height:100vh;background:#131313;color:#e5e2e1;font-family:Manrope, sans-serif}
    .admin-panel{background:#1d1d1d;border:1px solid rgba(252,207,62,.18);border-radius:14px}
    .admin-input{width:100%;background:#111;color:#fff;border:1px solid #494949;border-radius:8px;padding:12px}
    .admin-button{background:#fccf3e;color:#131313;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer}
    .admin-button:disabled{opacity:.55;cursor:wait}
    .admin-muted{color:#a8a29e}
    .admin-image{width:110px;height:90px;object-fit:cover;border-radius:8px;border:1px solid #494949}
    .hidden-view{display:none!important}
  </style>
</head>
<body class="admin-shell">
  <main class="max-w-5xl mx-auto px-5 py-8">
    <section id="loginView" class="min-h-screen grid place-items-center">
      <form id="loginForm" class="admin-panel w-full max-w-md p-7 space-y-5">
        <div class="text-center"><span class="material-symbols-outlined text-primary text-4xl">lock</span><h1 class="text-2xl text-primary font-bold mt-2">دخول الإدارة</h1></div>
        <label class="block">البريد الإلكتروني<input id="email" class="admin-input mt-2" type="email" required autocomplete="username"></label>
        <label class="block">كلمة المرور<input id="password" class="admin-input mt-2" type="password" required autocomplete="current-password"></label>
        <button class="admin-button w-full" type="submit">دخول</button>
        <p id="loginError" class="text-red-400 text-sm"></p>
      </form>
    </section>

    <section id="dashboardView" class="hidden-view">
      <header class="flex flex-wrap items-center justify-between gap-4 mb-8">
        <div><p class="admin-muted text-sm">إدارة الصور</p><h1 class="text-3xl text-primary font-bold">كتالوج العمارى</h1></div>
        <button id="logoutButton" class="admin-button">تسجيل الخروج</button>
      </header>
      <section class="admin-panel p-6 mb-6">
        <h2 class="text-xl font-bold mb-4">إضافة صور للكتالوج</h2>
        <label class="block mb-4">الفئة<select id="categorySelect" class="admin-input mt-2"></select></label>
        <label class="block mb-4">اختاري صورًا متعددة<input id="imageInput" class="admin-input mt-2" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
        <div id="preview" class="flex flex-wrap gap-3 mb-4"></div>
        <button id="uploadButton" class="admin-button" type="button">حفظ الصور</button>
        <p id="status" class="admin-muted text-sm mt-3"></p>
      </section>
      <section class="admin-panel p-6">
        <h2 class="text-xl font-bold mb-4">الصور المحفوظة</h2>
        <div id="savedImages" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4"></div>
      </section>
    </section>
  </main>
<script>
  const state = { categories: [], token: null };
  const $ = id => document.getElementById(id);
  const showLogin = () => { $('loginView').classList.remove('hidden-view'); $('dashboardView').classList.add('hidden-view'); };
  const showDashboard = () => { $('loginView').classList.add('hidden-view'); $('dashboardView').classList.remove('hidden-view'); };
  const redirectExpired = response => { if (response.status === 401) { showLogin(); return true; } return false; };

  async function loadCategories() {
    const response = await fetch('/api/admin/categories');
    if (redirectExpired(response)) return;
    state.categories = await response.json();
    $('categorySelect').innerHTML = state.categories.map(category => `<option value="${category.id}">${category.name_ar}</option>`).join('');
    await loadImages();
  }
  async function loadImages() {
    const categoryId = $('categorySelect').value;
    if (!categoryId) return;
    const response = await fetch(`/api/admin/categories/${categoryId}/images`);
    if (redirectExpired(response)) return;
    const images = await response.json();
    $('savedImages').innerHTML = images.length ? images.map(image => `<figure class="relative"><img class="admin-image w-full" src="${image.public_url}" alt="${image.alt_text || ''}"><button class="absolute top-1 left-1 bg-red-600 text-white rounded px-2 py-1 text-xs" data-delete="${image.id}">حذف</button></figure>`).join('') : '<p class="admin-muted">لا توجد صور محفوظة لهذه الفئة.</p>';
    document.querySelectorAll('[data-delete]').forEach(button => button.addEventListener('click', () => deleteImage(button.dataset.delete)));
  }
  async function deleteImage(id) {
    if (!confirm('هل تريدين حذف الصورة؟')) return;
    const response = await fetch(`/api/admin/images/${id}`, { method: 'DELETE' });
    if (redirectExpired(response)) return;
    if (!response.ok) return setStatus('تعذر حذف الصورة', true);
    await loadImages(); setStatus('تم حذف الصورة');
  }
  function setStatus(message, error = false) { $('status').textContent = message; $('status').className = error ? 'text-red-400 text-sm mt-3' : 'text-green-400 text-sm mt-3'; }
  $('loginForm').addEventListener('submit', async event => {
    event.preventDefault(); $('loginError').textContent = '';
    const response = await fetch('/api/admin/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: $('email').value, password: $('password').value }) });
    const data = await response.json();
    if (!response.ok) return $('loginError').textContent = data.error || 'بيانات الدخول غير صحيحة';
    showDashboard(); await loadCategories();
  });
  $('categorySelect').addEventListener('change', loadImages);
  $('imageInput').addEventListener('change', () => {
    $('preview').innerHTML = '';
    Array.from($('imageInput').files).forEach(file => {
      const image = document.createElement('img');
      image.className = 'admin-image';
      image.alt = file.name;
      image.src = URL.createObjectURL(file);
      $('preview').appendChild(image);
    });
  });
  $('uploadButton').addEventListener('click', async () => {
    const files = $('imageInput').files;
    if (!files.length) return setStatus('اختاري صورة واحدة على الأقل', true);
    const form = new FormData(); Array.from(files).forEach(file => form.append('images', file));
    $('uploadButton').disabled = true; setStatus('جاري حفظ الصور...');
    const response = await fetch(`/api/admin/categories/${$('categorySelect').value}/images`, { method: 'POST', body: form });
    $('uploadButton').disabled = false;
    if (redirectExpired(response)) return;
    if (!response.ok) { const data = await response.json(); return setStatus(data.error || 'فشل رفع الصور', true); }
    $('imageInput').value = ''; $('preview').innerHTML = ''; await loadImages(); setStatus('تم حفظ الصور بنجاح');
  });
  $('logoutButton').addEventListener('click', async () => { await fetch('/api/admin/logout', { method: 'POST' }); showLogin(); });
  fetch('/api/admin/session').then(async response => { if (response.ok) { showDashboard(); await loadCategories(); } else showLogin(); });
</script>
</body>
</html>
